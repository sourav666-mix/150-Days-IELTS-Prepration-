  <title>IELTS Pro 150 — Band 8 Preparation</title>

  <!-- ================= APP LAYOUT ================= -->
  <div class="app">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <div class="side-progress card-soft">
        <div class="side-progress-top">
          <span class="kicker">150-day journey</span>
          <span id="side-percent" class="side-percent">0%</span>
        </div>
        <div class="progressbar"><div id="side-progress-fill" class="progressbar-fill" style="width:0%"></div></div>
        <p id="side-day-label" class="hint">Day 1 of 150 · Foundation</p>
      </div>

      <nav class="side-nav">
        <a class="nav-item active" href="#/dashboard" data-view="dashboard"><svg class="icon"><use href="#ic-home"/></svg><span>Dashboard</span></a>
        <a class="nav-item" href="#/reading"   data-view="reading"><svg class="icon"><use href="#ic-book"/></svg><span>Reading</span><em class="nav-tag">60 min</em></a>
        <a class="nav-item" href="#/writing"   data-view="writing"><svg class="icon"><use href="#ic-pen"/></svg><span>Writing</span><em class="nav-tag">60 min</em></a>
        <a class="nav-item" href="#/listening" data-view="listening"><svg class="icon"><use href="#ic-headphones"/></svg><span>Listening</span><em class="nav-tag">30 min</em></a>
        <a class="nav-item" href="#/progress"  data-view="progress"><svg class="icon"><use href="#ic-chart"/></svg><span>Progress</span></a>
        <a class="nav-item" href="#/review"    data-view="review"><svg class="icon"><use href="#ic-file"/></svg><span>Review</span></a>
        <a class="nav-item" href="#/mock"      data-view="mock"><svg class="icon"><use href="#ic-target"/></svg><span>Mock Exam</span><em class="nav-tag">2h30m</em></a>
      </nav>

      <div class="side-target card-soft">
        <div class="side-target-row">
          <svg class="icon accent"><use href="#ic-target"/></svg>
          <div>
            <strong>Target: Band 8.0</strong>
            <p class="hint">No login. All progress is stored on this device.</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Content column -->
    <div class="content">

      <!-- Top bar -->
      <header class="topbar">
        <a class="brand" href="#/dashboard">
          <span class="brand-mark">150</span>
          <span class="brand-text">IELTS&nbsp;Pro<small>Band 8 Journey</small></span>
        </a>
        <div class="topbar-right">
          <div class="pill" title="Current day">
            <svg class="icon"><use href="#ic-calendar"/></svg><span id="dayPill">Day 1 / 150</span>
          </div>
          <div class="pill pill-streak" title="Study streak (consecutive days)">
            <svg class="icon flame"><use href="#ic-flame"/></svg><span id="streakPill">0</span>
          </div>
          <button id="themeToggle" class="icon-btn" title="Toggle theme"><svg class="icon"><use href="#ic-moon"/></svg></button>
          <button id="settingsBtn" class="icon-btn" title="Settings"><svg class="icon"><use href="#ic-gear"/></svg></button>
        </div>
      </header>

      <!-- Views -->
      <main id="main">
        <section id="view-dashboard" class="view active"></section>
        <section id="view-reading"   class="view"></section>
        <section id="view-writing"   class="view"></section>
        <section id="view-listening" class="view"></section>
        <section id="view-progress"  class="view"></section>
        <section id="view-review"    class="view"></section>
        <section id="view-mock"      class="view"></section>
      </main>
    </div>
  </div>

  <!-- Bottom navigation (mobile — 7 items) -->
  <nav class="bottom-nav">
    <a href="#/dashboard" data-view="dashboard"><svg class="icon"><use href="#ic-home"/></svg><span>Home</span></a>
    <a href="#/reading"   data-view="reading"><svg class="icon"><use href="#ic-book"/></svg><span>Reading</span></a>
    <a href="#/writing"   data-view="writing"><svg class="icon"><use href="#ic-pen"/></svg><span>Writing</span></a>
    <a href="#/listening" data-view="listening"><svg class="icon"><use href="#ic-headphones"/></svg><span>Listen</span></a>
    <a href="#/progress"  data-view="progress"><svg class="icon"><use href="#ic-chart"/></svg><span>Progress</span></a>
    <a href="#/review"    data-view="review"><svg class="icon"><use href="#ic-file"/></svg><span>Review</span></a>
    <a href="#/mock"      data-view="mock"><svg class="icon"><use href="#ic-target"/></svg><span>Mock</span></a>
  </nav>

  <!-- Toasts & modals -->
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript><div style="padding:2rem;text-align:center;font-family:sans-serif">Please enable JavaScript to use IELTS Pro 150.</div></noscript>

  <!-- Scripts (order matters: foundations → AI → data banks → modules → prefs → mock/review → boot) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/prompts.js"></script>
  <script src="data/study-plan.js"></script>
  <script src="js/records.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/progress.js"></script>
  <script src="data/reading-passages.js"></script>
  <script src="js/reading.js"></script>
  <script src="data/writing-topics.js"></script>
  <script src="js/writing.js"></script>
  <script src="data/listening-data.js"></script>
  <script src="js/listening.js"></script>
  <script src="js/exam-prefs.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/review.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
